services:
  broker:
    image: eclipse-mosquitto:2
    container_name: p3-broker
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
    ports:
      - "1883:1883"   # không mã hóa, chỉ để demo Wireshark
      - "8883:8883"   # TLS + mTLS
    networks: [iotnet]

  ca:
    build: ./ca
    container_name: p3-ca
    environment:
      CA_CERT_PATH: /srv/pki/ca.crt
      CA_KEY_PATH: /srv/pki/ca.key
      CA_DB_PATH: /srv/data/ca.db
      CRL_URL: http://ca:8000/cert/crl
    volumes:
      - ./certs/ca.crt:/srv/pki/ca.crt:ro
      - ./certs/ca.key:/srv/pki/ca.key:ro
      - ./ca/data:/srv/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [iotnet]

  device-a:           # thiết bị nhận
    build: ./device
    command: ["python", "mqtt_client.py", "sub", "device-a"]
    environment:
      BROKER_HOST: broker
      DEVICE_ID: device-a
      ENROLL_TOKEN: ${DEVICE_A_TOKEN:-}
      CA_URL: http://ca:8000
      CA_CERT_PATH: /pinned/ca.crt
      DATA_DIR: /data
    volumes:
      - ./certs/ca.crt:/pinned/ca.crt:ro   # chỉ root cert công khai
      - device-a-data:/data                # khóa + cert riêng của thiết bị
    depends_on:
      broker:
        condition: service_started
      ca:
        condition: service_healthy
    networks: [iotnet]

  device-b:           # thiết bị gửi
    build: ./device
    command: ["python", "mqtt_client.py", "pub", "device-b"]
    environment:
      BROKER_HOST: broker
      DEVICE_ID: device-b
      ENROLL_TOKEN: ${DEVICE_B_TOKEN:-}
      CA_URL: http://ca:8000
      CA_CERT_PATH: /pinned/ca.crt
      DATA_DIR: /data
    volumes:
      - ./certs/ca.crt:/pinned/ca.crt:ro
      - device-b-data:/data
    depends_on:
      broker:
        condition: service_started
      ca:
        condition: service_healthy
      device-a:
        condition: service_started
    networks: [iotnet]

volumes:
  device-a-data:
  device-b-data:

networks:
  iotnet:
    driver: bridge